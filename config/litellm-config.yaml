model_list:
  # ============================================================
  # AWS Bedrock — Claude (IAM Task Role auth, no API key needed)
  # ============================================================
  # Region is inherited from the AWS_REGION_NAME env var injected by the
  # ECS task (cfn/04-ecs.yaml sets it to the deployment region). Do NOT
  # hardcode aws_region_name here — that would break non-us-east-1 deploys.
  # All Bedrock model IDs use the cross-region inference profile prefix
  # (us. / eu. / apac.) matching your deployment region.
  #
  # ⚠️ Bedrock model access must be enabled in your region first
  #    (Bedrock console → Model access), or every call returns 403.

  # Claude Opus 5 — most capable. 1M context / 128K output, adaptive thinking on.
  # ⚠️ Rejects temperature/top_p/top_k (deprecated → ValidationException); must drop.
  - model_name: claude-opus-5
    litellm_params:
      model: bedrock/us.anthropic.claude-opus-5
      additional_drop_params:
        - context_management
        - temperature
        - top_p
        - top_k
    model_info:
      max_input_tokens: 1000000
      max_output_tokens: 128000
      supports_function_calling: true
      supports_vision: true
      supports_prompt_caching: true
      supports_reasoning: true

  # Claude Sonnet 4.6 — best price/performance. Recommended default.
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-4-6
      additional_drop_params:
        - context_management

  # Claude Haiku 4.5 — fastest & cheapest.
  - model_name: claude-haiku-4-5
    litellm_params:
      model: bedrock/us.anthropic.claude-haiku-4-5-20251001-v1:0
      additional_drop_params:
        - context_management

  # ============================================================
  # AWS Bedrock — OpenAI GPT-5.6 (Bedrock Mantle, IAM Task Role auth)
  # ============================================================
  # GPT-5.6 runs on the bedrock-mantle endpoint via the OpenAI Responses API
  # (base https://bedrock-mantle.<region>.api.aws, path /openai/v1/responses).
  # LiteLLM's bedrock_mantle provider uses a Bearer token if present, else
  # falls back to AWS SigV4 (service "bedrock") over the standard credential
  # chain — i.e. the ECS Task Role. No API key needed.
  #
  # ⚠️ The Task Role needs bedrock-mantle permissions (see cfn/04-ecs.yaml
  #    BedrockMantleAccess statement); the classic bedrock:InvokeModel does
  #    NOT cover the bedrock-mantle namespace.
  # ⚠️ GPT-5.x deprecate temperature/top_p/top_k — must drop or callers 400.
  # Region availability: Sol = us-east-1/us-east-2; Terra & Luna add us-west-2.
  #
  # Sol   — flagship reasoning + agentic (coding, security, research).
  # Terra — balanced, ~half the cost of Sol, general production workloads.
  # Luna  — fastest & cheapest, high-volume / latency-sensitive tasks.
  - model_name: gpt-5.6-sol
    litellm_params:
      model: bedrock_mantle/openai.gpt-5.6-sol
      additional_drop_params:
        - context_management
        - temperature
        - top_p
        - top_k

  - model_name: gpt-5.6-terra
    litellm_params:
      model: bedrock_mantle/openai.gpt-5.6-terra
      additional_drop_params:
        - context_management
        - temperature
        - top_p
        - top_k

  - model_name: gpt-5.6-luna
    litellm_params:
      model: bedrock_mantle/openai.gpt-5.6-luna
      additional_drop_params:
        - context_management
        - temperature
        - top_p
        - top_k

  # ============================================================
  # AWS Bedrock — OpenAI GPT-6 Astra (Bedrock Mantle, native Responses API)
  # ============================================================
  # ⚠️ Unlike GPT-5.6, Astra's mantle endpoint exists ONLY in us-west-2, so the
  #    region IS pinned here on purpose (it cannot inherit AWS_REGION_NAME).
  #    A gateway deployed elsewhere still reaches Astra cross-region.
  #
  # 🔴 The three model_info flags below are what actually enable the native
  #    /v1/responses path. LiteLLM's mantle_supports_responses() is purely
  #    data-driven: it reads supported_endpoints off the model cost map, and
  #    releases up to 1.100.1 have no gpt-6 entry at all -> the gate returns
  #    False and the request is silently downgraded to a chat/completions
  #    emulation, which then fails for function tools. Overriding via
  #    model_info is the documented path ("onboarding a model is a JSON
  #    change, never a code change"). Drop these three once the upstream cost
  #    map ships an Astra entry (present in 1.102.0rc1).
  #
  # ⚠️ reasoning.summary: Mantle only accepts "auto" (or absent) for Astra;
  #    "detailed"/"concise" return 500 unsupported_parameter. Clients that
  #    hardcode it (ChatGPT desktop app) need the callback stripper below —
  #    drop_params does NOT help, because `reasoning` itself is a valid
  #    Responses param and its nested keys are never inspected.
  #    Codex CLI can instead set model_reasoning_summary = "auto"|"none".
  #
  # ⚠️ Server-side computer use is NOT reachable through LiteLLM: the mantle
  #    tool-type allowlist is a hardcoded frozenset and `computer` /
  #    `apply_patch` are silently dropped (still true in 1.102.0rc1, which
  #    only added `web_search`). Needs a patched image, not a config change.
  - model_name: gpt-6-astra
    litellm_params:
      model: bedrock_mantle/openai.gpt-6-astra
      aws_region_name: us-west-2
      additional_drop_params:
        - context_management
        - temperature
        - top_p
        - top_k
    model_info:
      supported_endpoints: ["/v1/responses"]
      use_openai_responses_path: true
      mode: responses
      max_input_tokens: 1050000
      max_output_tokens: 128000
      input_cost_per_token: 0.000011
      output_cost_per_token: 0.000055
      cache_read_input_token_cost: 0.0000011
      supports_prompt_caching: true
      supports_function_calling: true
      supports_reasoning: true
      supports_vision: true

  # Fallback channel via bedrock-runtime Converse (keep it).
  # Use when a LiteLLM version drops tool types on the mantle path. Plain
  # function calling / vision / max_tokens limiting all work here; server-side
  # computer use does not. In-Region model IDs are unsupported — a cross-region
  # inference profile (us. / global.) is required, and the explicit `converse/`
  # prefix stops LiteLLM from falling back to InvokeModel on a new model id.
  - model_name: gpt-6-astra-runtime
    litellm_params:
      model: bedrock/converse/global.openai.gpt-6-astra
      additional_drop_params:
        - context_management
        - temperature
        - top_p
        - top_k
    model_info:
      max_input_tokens: 1050000
      max_output_tokens: 128000
      input_cost_per_token: 0.00001
      output_cost_per_token: 0.00005
      cache_read_input_token_cost: 0.000001
      supports_function_calling: true
      supports_vision: true

  # ============================================================
  # OpenAI API (optional — requires OPENAI_API_KEY in Secrets Manager)
  # ============================================================
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4.1
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY

  # ============================================================
  # Anthropic API (optional — requires ANTHROPIC_API_KEY)
  # ============================================================
  - model_name: claude-sonnet-4-20250514
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY
      additional_drop_params:
        - context_management

  - model_name: claude-haiku-4-5-20251001
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY
      additional_drop_params:
        - context_management

  # ============================================================
  # Google Gemini (optional — requires GEMINI_API_KEY)
  # ============================================================
  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY

  - model_name: gemini-2.5-pro
    litellm_params:
      model: gemini/gemini-2.5-pro-preview-05-06
      api_key: os.environ/GEMINI_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  callbacks: ["bedrock_ctx_stripper.bedrock_ctx_stripper_instance"]
  num_retries: 3
  request_timeout: 180
  timeout: 120
  set_verbose: false
  drop_params: true
  additional_drop_params:
    - context_management
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ssl: true
